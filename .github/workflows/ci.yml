name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (types, test, build; lint advisory)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gui/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: gui/frontend/package-lock.json
      - run: npm ci
      # Lint is advisory for now: LiveView/ResultView carry pre-existing react-hooks
      # violations (Date.now() in render, setState-in-effect) plus an unused var.
      # Tracked as tech debt; flip this to blocking once they are cleaned up.
      - name: Lint (advisory)
        run: npm run lint
        continue-on-error: true
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  python-unit:
    name: Python unit tests (pure; CAD/Docker excluded)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install pytest -r gui/requirements.txt
      # Discovery (not a hand-maintained file list) so new test files run
      # automatically. tests/conftest.py puts the repo root + scripts/ on the
      # path. tests/test_body_cleanup.py needs CadQuery/OCP and the
      # cadrille:latest image, so it is the one file excluded here and run
      # inside Docker on RXL instead.
      - run: pytest tests/ --ignore=tests/test_body_cleanup.py -v
